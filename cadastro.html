<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro | GMAC Leilões</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;
    color:#333
}
header{
    background:#111;
    padding:20px
}
.topo{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center
}
.logo{max-width:90px}
nav a{
    color:#d4af37;
    margin-left:20px;
    text-decoration:none;
    font-weight:bold
}

/* MOBILE MENU */
.menu-mobile{display:none;font-size:28px;color:#d4af37;cursor:pointer}
.mobile-nav{
    position:fixed;
    top:0;right:-100%;
    width:260px;height:100%;
    background:#111;
    padding:30px;
    transition:.4s;
    z-index:99
}
.mobile-nav a{
    display:block;
    margin:20px 0;
    color:#d4af37;
    text-decoration:none;
    font-size:18px
}
.mobile-nav.open{right:0}

/* FORM */
section{
    padding:60px 20px
}
.form-container{
    max-width:600px;
    margin:auto;
    background:#fff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1)
}
.form-container h1{
    text-align:center;
    color:#111;
    margin-bottom:10px
}
.form-container p{
    text-align:center;
    margin-bottom:30px
}
form input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px
}
form button{
    width:100%;
    padding:16px;
    background:#d4af37;
    border:none;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer
}

/* FOOTER */
footer{
    background:#1c1c1c;
    color:#ccc;
    padding:60px 20px
}
.footer-container{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:40px
}
footer h4{color:#d4af37}
iframe{width:100%;border-radius:10px}

/* WHATSAPP */
.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    width:55px;height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
    z-index:98
}
.whatsapp img{width:28px}

/* MOBILE */
@media(max-width:768px){
    nav{display:none}
    .menu-mobile{display:block}
}
</style>
</head>

<body>

<header>
<div class="topo">
<img src="img/logo-gmac.png" class="logo">
<nav>
<a href="index.html">Início</a>
<a href="veiculos.html">Veículos</a>
<a href="rastreamento.html">Rastreamento</a>
<a href="faq.html">FAQ</a>
</nav>
<div class="menu-mobile" onclick="toggleMenu()">☰</div>
</div>
</header>

<div class="mobile-nav" id="mobileNav">
<a href="index.html">Início</a>
<a href="veiculos.html">Veículos</a>
<a href="rastreamento.html">Rastreamento</a>
<a href="faq.html">FAQ</a>
</div>

<section>
<div class="form-container">
<h1>Cadastro do Cliente</h1>
<p>Preencha corretamente para dar continuidade no processo.</p>

<form onsubmit="enviarWhats(event)">
<input type="text" id="nome" placeholder="Nome Completo" required>
<input type="text" id="cpf" placeholder="CPF">
<input type="text" id="rg" placeholder="RG">
<input type="date" id="nascimento">
<input type="text" id="endereco" placeholder="Endereço Completo">
<input type="text" id="cep" placeholder="CEP">
<input type="tel" id="telefone" placeholder="Telefone / WhatsApp" required>
<input type="email" id="email" placeholder="E-mail">

<button type="submit">Enviar Cadastro</button>
</form>
</div>
</section>

<footer>
<div class="footer-container">
<div>
<h4>GMAC Leilões</h4>
<p>
CNPJ: 52.654.051/0001-30<br>
Tel: (14) 3197-4294<br>
Bauru - SP<br><br>
Agente de Liquidação Exclusivo BV Financeira
</p>
</div>

<div>
<h4>Localização</h4>
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3690.4156702463656!2d-49.10285562547099!3d-22.337928417787076"></iframe>
</div>
</div>
</footer>

<a class="whatsapp" href="https://wa.me/5511970512149" target="_blank">
<img src="img/WhatsApp.svg.webp">
</a>

<script>
function toggleMenu(){
    document.getElementById('mobileNav').classList.toggle('open')
}

function enviarWhats(e){
    e.preventDefault()

    const dados =
`*NOVO CADASTRO GMAC*
Nome: ${nome.value}
CPF: ${cpf.value}
RG: ${rg.value}
Nascimento: ${nascimento.value}
Endereço: ${endereco.value}
CEP: ${cep.value}
Telefone: ${telefone.value}
Email: ${email.value}`

    window.open(`https://wa.me/5511970512149?text=${encodeURIComponent(dados)}`,'_blank')
}
</script>

</body>
</html>
